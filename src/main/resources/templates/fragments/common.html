<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Navigation Fragment -->
    <div th:fragment="navigation" class="navigation-header">
        <div class="nav-container">
            <div class="nav-links">
                <a href="/login" class="nav-link">Login</a>
                <a href="/register" class="nav-link">Register</a>
                <a href="#" class="nav-link" id="logoutLink">Logout</a>
            </div>
            <script>
                document.getElementById('logoutLink').addEventListener('click', async function(e) {
                    e.preventDefault();
                    
                    // Call logout API
                    try {
                        const response = await fetch('/api/v1/auth/logout/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });
                        
                        if (response.ok) {
                            // Clear cookies
                            document.cookie = 'auth_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; secure';
                            document.cookie = 'refresh_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; secure';
                            
                            // Redirect to logout page
                            window.location.href = '/logout';
                        }
                    } catch (error) {
                        console.error('Logout failed:', error);
                    }
                });
            </script>
        </div>
    </div>

    <!-- Common CSS Link Fragment -->
    <th:block th:fragment="common-styles">
        <link rel="stylesheet" type="text/css" href="/css/common.css">
    </th:block>
</body>
</html>
