<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Create New Table - Robome Application</title>
    <th:block th:replace="~{fragments/common :: common-styles}"></th:block>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navigation}"></th:block>
    <div class="container small">
        <h1 th:text="${title}">Create New Table</h1>
        <p class="welcome-message" th:text="${message}">Create a new table to organize your work.</p>
        
        <form id="createTableForm">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" required></textarea>
            </div>
            
            <button type="submit" class="btn" id="submitBtn">Create Table</button>
            <div class="loading" id="loading">Creating table...</div>
        </form>
        
        <div class="message" id="message"></div>
        
        <div class="navigation-links">
            <a href="/" class="nav-link">← Back to Home</a>
        </div>
        <div class="navigation-links" id="postCreateLinks" style="display:none; margin-top: 1em;">
            <a href="/tables" class="nav-link">View All Tables</a> |
            <a href="/create-table" class="nav-link">Create Another Table</a>
        </div>
    </div>

    <script>
        document.getElementById('createTableForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const messageDiv = document.getElementById('message');
            
            // Get form data
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            
            // Validate form
            if (!title || !description) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }
            
            // Get auth token from cookie
            const authToken = getCookie('access_token') || getCookie('auth_token');
            if (!authToken) {
                window.location.href = '/login';
                return;
            }
            
            // Disable form and show loading
            submitBtn.disabled = true;
            loading.style.display = 'block';
            messageDiv.style.display = 'none';
            
            try {
                // Get the current user's ID from the auth token
                // const tokenPayload = parseJwt(authToken); // Not needed for auth

                const response = await fetch(`/api/v1/tables/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': authToken
                    },
                    body: JSON.stringify({
                        title: title,
                        description: description
                    })
                });
                
                if (response.ok) {
                    showMessage('Table created successfully! See options below.', 'success');
                    document.getElementById('postCreateLinks').style.display = 'block';
                } else {
                    const errorText = await response.text();
                    let errorMessage = 'Failed to create table. Please try again.';
                    
                    try {
                        const errorData = JSON.parse(errorText);
                        if (errorData.message) {
                            errorMessage = errorData.message;
                        } else if (errorData.errors && errorData.errors.length > 0) {
                            errorMessage = errorData.errors.map(err => err.message).join(', ');
                        }
                    } catch (e) {
                        // Keep default message if parsing fails
                    }
                    
                    showMessage(errorMessage, 'error');
                }
            } catch (error) {
                showMessage('Network error. Please check your connection and try again.', 'error');
            } finally {
                // Re-enable form and hide loading
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }

        // Helper to get cookie by name
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }
    </script>
</body>
</html>
