<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Logged Out - Robome Application</title>
    <th:block th:replace="~{fragments/common :: common-styles}"></th:block>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navigation}"></th:block>
    <div class="container medium">
        <div class="success-icon">✓</div>
        <h1 th:text="${title}">Logged Out</h1>
        <p class="logout-message" th:text="${message}">You have been successfully logged out of your account.</p>
        
        <div class="info-section">
            <h3>Session Information</h3>
            <p>Your session has been terminated securely.</p>
            <p>Thank you for using Robome!</p>
        </div>
        
        <div class="navigation-links">
            <a href="/" class="content-nav-link">← Back to Home</a>
            <a href="/register" class="content-nav-link secondary">Create New Account</a>
        </div>
        
        <div class="timestamp">
            Logged out successfully
        </div>
    </div>
</body>
</html>
