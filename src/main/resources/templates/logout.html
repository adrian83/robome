<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Logged Out - Robome Application</title>
    <th:block th:replace="~{fragments/common :: common-styles}"></th:block>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        .logout-message {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .success-icon {
            font-size: 4em;
            color: #28a745;
            margin-bottom: 20px;
        }
        .info-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        .navigation-links {
            margin-top: 30px;
        }
        .nav-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 24px;
            margin: 5px;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            font-size: 16px;
        }
        .nav-link:hover {
            background: #764ba2;
        }
        .nav-link.secondary {
            background: #6c757d;
        }
        .nav-link.secondary:hover {
            background: #5a6268;
        }
        .timestamp {
            color: #888;
            font-style: italic;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navigation}"></th:block>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1 th:text="${title}">Logged Out</h1>
        <p class="logout-message" th:text="${message}">You have been successfully logged out of your account.</p>
        
        <div class="info-section">
            <h3>Session Information</h3>
            <p>Your session has been terminated securely.</p>
            <p>Thank you for using Robome!</p>
        </div>
        
        <div class="navigation-links">
            <a href="/" class="nav-link">← Back to Home</a>
            <a href="/register" class="nav-link secondary">Create New Account</a>
        </div>
        
        <div class="timestamp">
            Logged out successfully
        </div>
    </div>
</body>
</html>
