<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Robome Application</title>
    <th:block th:replace="~{fragments/common :: common-styles}"></th:block>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navigation}"></th:block>
    <div class="container">
        <h1 th:text="${title}">Welcome</h1>
        <p class="welcome-message" th:text="${message}">Your application is running successfully!</p>
        
        <div class="api-links">
            <h3>Available Pages</h3>
            <div th:if="${isLoggedIn}">
                <a href="/tables" class="api-link">My Tables</a>
                <a href="/create-table" class="api-link">Create New Table</a>
                <a href="/logout" class="api-link">Logout</a>
            </div>
            <div th:unless="${isLoggedIn}">
                <a href="/login" class="api-link">Sign In</a>
                <a href="/register" class="api-link">Create Account</a>
            </div>
            <a href="/api/v1/health/" class="api-link">Health Check</a>
        </div>
        
        <div class="timestamp" th:text="'Page generated at: ' + ${timestamp}">
            Page generated at: Loading...
        </div>
    </div>
</body>
</html>
