<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Sign In - Robome Application</title>
    <th:block th:replace="~{fragments/common :: common-styles}"></th:block>
</head>
<body>
    <th:block th:replace="~{fragments/common :: navigation}"></th:block>
    <div class="container small">
        <h1 th:text="${title}">Sign In</h1>
        <p class="welcome-message" th:text="${message}">Please sign in to your account to continue.</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn" id="submitBtn">Sign In</button>
            <div class="loading" id="loading">Signing in...</div>
        </form>
        
        <div class="message" id="message"></div>
        
        <div class="navigation-links">
            <a href="/" class="nav-link">← Back to Home</a>
            <a href="/register" class="nav-link">Create New Account</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const messageDiv = document.getElementById('message');
            
            // Get form data
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Validate form
            if (!email || !password) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }
            
            // Disable form and show loading
            submitBtn.disabled = true;
            loading.style.display = 'block';
            messageDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/v1/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                if (response.ok) {
                    const tokens = await response.json();

                    console.log('Received tokens:', tokens);

                    // Store tokens in cookies
                    if (tokens.accessToken) {
                        document.cookie = `access_token=${encodeURIComponent(tokens.accessToken)}; path=/; max-age=7200`; // 2 hours
                    }
                    if (tokens.refreshToken) {
                        document.cookie = `refresh_token=${encodeURIComponent(tokens.refreshToken)}; path=/; max-age=2592000`; // 30 days
                    }
                    
                    showMessage('Login successful! Redirecting...', 'success');
                    
                    // Redirect to home page after successful login
                    setTimeout(() => {
                        window.location.href = '/tables';
                    }, 1500);
                } else {
                    const errorText = await response.text();
                    let errorMessage = 'Login failed. Please check your credentials.';
                    
                    try {
                        const errorData = JSON.parse(errorText);
                        if (errorData.message) {
                            errorMessage = errorData.message;
                        } else if (errorData.errors && errorData.errors.length > 0) {
                            errorMessage = errorData.errors.map(err => err.message).join(', ');
                        }
                    } catch (e) {
                        // Keep default message if parsing fails
                    }
                    
                    showMessage(errorMessage, 'error');
                }
            } catch (error) {
                showMessage('Network error. Please check your connection and try again.', 'error');
            } finally {
                // Re-enable form and hide loading
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
